# Auto-install TPM plugins on first run
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
    'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

# ==========================
# ===  General Settings  ===
# ==========================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # Enable 24-bit Truecolor support
set -g history-limit 50000                     # Increase scrollback buffer size
set -g buffer-limit 20                         # Maximum copy buffers
set -sg escape-time 0                          # Remove delay for escape keys (crucial for Vim/Nvim)
set -g display-time 1500                       # Message display duration (ms)
set -g repeat-time 300                         # Repeat key press timeout
set -g base-index 1                            # Start window numbering at 1 (matches keyboard layout)
setw -g pane-base-index 1                      # Start pane numbering at 1
set -g mouse on                                # Enable full mouse support (clicking, resizing, scrolling)
set -g renumber-windows on                     # Automatically renumber windows when one is closed
set -g focus-events on                         # Pass focus events to terminal apps (e.g., Neovim)

# Clean Window Titles (Auto-renames tab to current working directory name)
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ==========================
# ===   TPM PLUGINS      ===
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # Seamless navigation between Vim split panes and Tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'          # Persist tmux environment across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'          # Continuous automatic saving of tmux environment
set -g @plugin 'tmux-plugins/tmux-yank'               # System clipboard integration for copy-mode
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'   # Visual status indicator when prefix key is pressed
set -g @plugin 'tmux-plugins/tmux-battery'            # Display battery status in status bar

set -g @continuum-restore 'on'                 # Automatically restore last saved session on startup
set -g @continuum-save-interval '15'           # Save tmux session state every 15 minutes

# ==========================
# ===   Key Bindings     ===
# ==========================

# --- Prefix Configuration ---
unbind C-b
set-option -g prefix C-a                       # Set Prefix to Ctrl+a
bind-key C-a send-prefix                       # Send Ctrl+a through to nested apps on double press

# --- Config Management ---
bind r source-file ~/.tmux.conf \; display "󰑓 Config Reloaded!" # Reload config with Prefix + r

# --- Split Panes ---
# Split window horizontally and vertically while preserving the current working directory
bind | split-window -h -c "#{pane_current_path}" # Prefix + | for horizontal split
bind - split-window -v -c "#{pane_current_path}" # Prefix + - for vertical split
unbind '"'
unbind %

# --- Pane Resizing ---
# Fine-tune pane dimensions using capital directions (-r allows key repetition)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Pane Movement ---
# Move current pane up/down in tree layout
bind < swap-pane -U
bind > swap-pane -D

# --- Window (Tab) Reordering / Moving ---
# Shift current tab left or right in the window bar
bind-key -r Shift-Left swap-window -t -1 \; select-window -t -1 # Prefix + Shift + Left Arrow: Move tab left
bind-key -r Shift-Right swap-window -t +1 \; select-window -t +1 # Prefix + Shift + Right Arrow: Move tab right

# --- Utilities & Synchronization ---
# Toggle sending keyboard inputs to all visible panes in the current window simultaneously
bind S setw synchronize-panes \; display "Sync panes: #{?pane_synchronized,󰓦 ON,󰓦 OFF}"

# Copy Mode Configuration (Vim Keybindings)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection         # 'v' starts selection in copy-mode
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle      # 'Ctrl+v' toggles block selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel # 'y' yanks text to clipboard and exits

# Interactive Session Switcher
# Spawns a floating popup window with fzf to search and switch tmux sessions on the fly
bind s display-popup -E -w 70% -h 60% "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Select Session' | xargs -r tmux switch-client -t"

# ==============================================================================
# ===  THEME: CATPPUCCIN MOCHA  ================================================
# ==============================================================================
# Official Catppuccin Mocha palette, applied with the same intentional
# hierarchy as before: Peach is the single warm accent reserved for
# "you are here" (active pane, active window). Mauve marks modal state
# (prefix/copy-mode). Everything ambient (session, date, clock) gets its
# own distinct cool hue instead of competing for the same attention.

set -g @thm_bg      "#11111b"   # Crust — near-black base
set -g @thm_bg_alt  "#1e1e2e"   # Base — status bar background
set -g @thm_surface "#313244"   # Surface0 — inactive segment fill
set -g @thm_overlay "#45475a"   # Surface1 — borders, subtle dividers
set -g @thm_muted   "#6c7086"   # Overlay0 — dim text / inactive labels
set -g @thm_fg      "#cdd6f4"   # Text — primary text

set -g @thm_accent   "#fab387"  # Peach — reserved for "active / here"
set -g @thm_accent2  "#cba6f7"  # Mauve — modal emphasis (prefix/copy mode)
set -g @thm_teal     "#94e2d5"  # Teal — session identity
set -g @thm_indigo   "#89b4fa"  # Blue — ambient info (date)
set -g @thm_green    "#a6e3a1"  # Green — status-good (battery/time)
set -g @thm_red      "#f38ba8"  # Red — status-alert, reserved for warnings only

# Prefix Highlight Indicator (rose = "modal state engaged")
set -g @prefix_highlight_prefix_prompt '󰌌 PREFIX'
set -g @prefix_highlight_copy_prompt '󰅍 COPY'
set -g @prefix_highlight_fg "#{@thm_bg}"
set -g @prefix_highlight_bg "#{@thm_accent2}"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=#{@thm_bg},bg=#{@thm_accent2},bold"

# Pane Borders & Messages — amber only on the pane you're actually in
set -g pane-border-style "fg=#{@thm_overlay}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g display-panes-colour "#{@thm_muted}"
set -g display-panes-active-colour "#{@thm_accent}"
set -g message-style "bg=#{@thm_accent},fg=#{@thm_bg},bold"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_fg}"

# Status Bar Base
set -g status-position top
set -g status-justify left
set -g status-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
set -g status-interval 5

# Status Left: Session Indicator (teal — calm, ambient identity, not "active")
set -g status-left-length 60
set -g status-left "#[fg=#{@thm_teal},bg=#{@thm_bg_alt}]#[fg=#{@thm_bg},bg=#{@thm_teal},bold] 󱂬 #S #[fg=#{@thm_teal},bg=#{@thm_bg_alt}]"

# Status Right: System Info Pills — muted surfaces, indigo/green accents only
set -g status-right-length 100
set -g status-right "#{prefix_highlight}#[fg=#{@thm_overlay},bg=#{@thm_bg_alt}]#[fg=#{@thm_muted},bg=#{@thm_surface}] 󰁹 #{battery_percentage} #[fg=#{@thm_surface},bg=#{@thm_bg_alt}]#[fg=#{@thm_indigo},bg=#{@thm_surface}] 󰃭 %d-%b #[fg=#{@thm_overlay},bg=#{@thm_bg_alt}]#[fg=#{@thm_bg},bg=#{@thm_green},bold] 󱑎 %H:%M #[fg=#{@thm_green},bg=#{@thm_bg_alt}]"

# ==============================================================================
# === WINDOW TABS: QUIET BY DEFAULT, WARM WHEN ACTIVE =========================
# ==============================================================================

# Inactive Window: flat surface, muted text — recedes into the bar
set -g window-status-format "#[fg=#{@thm_bg_alt},bg=#{@thm_bg_alt}]#[fg=#{@thm_muted},bg=#{@thm_surface}] #I #W #[fg=#{@thm_surface},bg=#{@thm_bg_alt}]"

# Active Window: solid amber block — the one unmistakable "you are here"
set -g window-status-current-format "#[fg=#{@thm_bg_alt},bg=#{@thm_bg_alt}]#[fg=#{@thm_bg},bg=#{@thm_accent},bold] #I #W#{?window_zoomed_flag, 󰍉,} #[fg=#{@thm_accent},bg=#{@thm_bg_alt}]"

set -g window-status-separator ""
set -g window-status-bell-style "fg=#{@thm_bg},bg=#{@thm_red},bold"

# Initialize TPM (Keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
