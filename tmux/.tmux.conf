# ==============================================================================
#  tmux.conf - Vibrant Catppuccin Mocha Setup
# ==============================================================================

# Auto-install TPM on first run
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

# --- General Settings ---------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # Truecolor support
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0                           # Instant response time
set -g display-time 2000
set -g repeat-time 300
set -g base-index 1                             # Start windows at 1
setw -g pane-base-index 1                       # Start panes at 1
set -g mouse on
set -g renumber-windows on                      # Auto-renumber closed windows
set -g focus-events on
set -g status-position top                      # Modern top bar layout

# Prevent long path auto-renaming from cluttering window tabs
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# --- Key Bindings -------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "󰑓 Config Reloaded!"

# Split panes in CWD
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize panes toggle
bind S setw synchronize-panes \; display "Sync panes: #{?pane_synchronized,󰓦 ON,󰓦 OFF}"

# Vi-mode copy bindings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Floating overlay session switcher with fzf
bind s display-popup -E -w 70% -h 60% "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Select Session' | xargs -r tmux switch-client -t"

# --- TPM Plugins --------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless Ctrl+hjkl navigation with Neovim
set -g @plugin 'catppuccin/tmux#v2.1.2'           # Catppuccin v2 core engine
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Check environment for battery engine (System vs Termux API)
if-shell 'which termux-battery-status' \
  'set -g @plugin "is333/tmux-termux-battery"' \
  'set -g @plugin "tmux-plugins/tmux-battery"'

# Continuum restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ==============================================================================
#  LIVELY CATPPUCCIN MOCHA THEME OVERRIDES
# ==============================================================================
set -g @catppuccin_flavor 'mocha'

# --- Window Tab Styling ---
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

# Clean Window Text (Only displays folder basename, e.g., 'dotfiles' instead of '/home/user/dotfiles')
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_color "#313244"
set -g @catppuccin_window_default_number_color "#b4befe"
set -g @catppuccin_window_default_text " #[fg=#cdd6f4]#{b:pane_current_path}"

# Active Window Highlight
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_color "#cba6f7"
set -g @catppuccin_window_current_number_color "#f5c2e7"
set -g @catppuccin_window_current_text " #[fg=#1e1e2e,bold]#{b:pane_current_path}#{?window_zoomed_flag, 󰍉,}"

# --- Pane Borders ---
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f5c2e7,bg=default"

# --- Popups & Command Line ---
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"
set -g mode-style "fg=#1e1e2e,bg=#89dceb,bold"

# --- Battery Dynamic Colors ---
set -g @batt_color_full_charge '#[fg=#a6e3a1,bg=#313244]'
set -g @batt_color_high_charge '#[fg=#a6e3a1,bg=#313244]'
set -g @batt_color_medium_charge '#[fg=#f9e2af,bg=#313244]'
set -g @batt_color_low_charge '#[fg=#f38ba8,bg=#313244]'
set -g @batt_color_charging '#[fg=#89b4fa,bg=#313244]'

set -g @catppuccin_battery_color "#{@thm_teal}"
set -g @catppuccin_battery_text " #{battery_color_charge}#{battery_percentage}#{battery_icon}"

# --- Module Accents & Dynamic Prefix Indicator ---
set -g @catppuccin_session_color "#{?client_prefix,#{@thm_red},#{@thm_peach}}"
set -g @catppuccin_session_text " #{?client_prefix,󰌌 PREFIX ,}#S"

set -g @catppuccin_directory_color "#{@thm_blue}"
set -g @catppuccin_date_time_color "#{@thm_mauve}"
set -g @catppuccin_date_time_text " %H:%M"

# --- Status Bar Assembly ---
set -g status-left ""
set -g status-right-length 120
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'


# ==============================================================================
#  󰌌  TMUX MOCHA WORKFLOW GUIDE & CHEATSHEET
# ==============================================================================
#
#  PREFIX KEY: Ctrl + a
#
#  --- 󰈈  SESSIONS & OVERLAYS ---
#  PREFIX + s       :: Open floating FZF Session Switcher popup (fuzzy search)
#  PREFIX + d       :: Detach from session
#  PREFIX + $       :: Rename current session
#  PREFIX + r       :: Live reload tmux configuration
#
#  --- 󰖲  PANES & NAVIGATION (Neovim Integration) ---
#  Ctrl + h/j/k/l   :: Move seamlessly between Tmux panes & Neovim splits (No prefix needed!)
#  PREFIX + |       :: Split pane vertically (opens in current working directory)
#  PREFIX + -       :: Split pane horizontally (opens in current working directory)
#  PREFIX + z       :: Toggle Pane Zoom (FULL SCREEN) - displays 󰍉 badge when active
#  PREFIX + x       :: Kill current pane
#  PREFIX + S       :: Toggle synchronized input across all panes in window
#  PREFIX + H/J/K/L :: Resize active pane by 5 cells
#
#  --- 󰓩  WINDOWS (TABS) ---
#  PREFIX + c       :: Create new window tab
#  PREFIX + ,       :: Rename current window
#  PREFIX + 1..9    :: Jump directly to window number 1-9
#  PREFIX + &       :: Kill current window
#
#  --- 󰅍  COPY MODE (Vim Bindings) ---
#  PREFIX + [       :: Enter copy mode
#  v                :: Begin selection
#  Ctrl + v         :: Begin block/rectangle selection
#  y                :: Copy selection to system clipboard & close copy mode
#  PREFIX + ]       :: Paste buffer
#
# ==============================================================================
#  󰒓  CUSTOMIZATION & TWEAK IDEAS
# ==============================================================================
#
#  1. FLAVOR SWAP:
#     To switch to a different Catppuccin variant, change `@catppuccin_flavor`:
#     - Options: 'latte', 'frappe', 'macchiato', 'mocha'
#     Example: set -g @catppuccin_flavor 'macchiato'
#
#  2. STATUS LINE POSITION:
#     Toggle status bar between top and bottom:
#     set -g status-position bottom
#
#  3. SWAP ACCENT COLORS:
#     Change module colors by targeting Catppuccin color variables:
#     - #{@thm_mauve}, #{@thm_pink}, #{@thm_red}, #{@thm_peach}, #{@thm_yellow},
#       #{@thm_green}, #{@thm_teal}, #{@thm_blue}, #{@thm_sapphire}, #{@thm_lavender}
#     Example: set -g @catppuccin_session_color "#{@thm_pink}"
#
#  4. EXTRA MODULES:
#     Add official CPU or RAM modules (requires installing `tmux-plugins/tmux-cpu` via TPM):
#     set -g @plugin 'tmux-plugins/tmux-cpu'
#     set -ag status-right "#{E:@catppuccin_status_cpu}"
#
# ==============================================================================
