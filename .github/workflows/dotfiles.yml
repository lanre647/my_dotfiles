name: dotfiles-ci

on:
  push:
  pull_request:

jobs:
  stow-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stow zsh tmux vim

      - name: Dry-run installer
        run: |
          mkdir -p "$RUNNER_TEMP/dotfiles-home/bin"
          ./install.sh --dry-run --no-packages --target "$RUNNER_TEMP/dotfiles-home"
